<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0a2e"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft outer glow -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="130" stroke="#6366f1" stroke-width="50" fill="none" opacity="0.2" filter="url(#outerGlow)"/>

  <!-- Main ring -->
  <circle cx="256" cy="256" r="120" stroke="url(#ring)" stroke-width="36" fill="none" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner highlight -->
  <circle cx="256" cy="256" r="120" stroke="#a5b4fc" stroke-width="6" fill="none" opacity="0.4" stroke-dasharray="80 600" stroke-dashoffset="200"/>

  <!-- Checkmark -->
  <path d="M196 256l40 40 80-80" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.95"/>

  <!-- Sparkle dots -->
  <circle cx="140" cy="160" r="4" fill="white" opacity="0.6"/>
  <circle cx="370" cy="180" r="3" fill="white" opacity="0.4"/>
  <circle cx="350" cy="360" r="5" fill="white" opacity="0.5"/>
  <circle cx="160" cy="340" r="3" fill="white" opacity="0.3"/>
  <circle cx="256" cy="100" r="3" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="400" cy="256" r="4" fill="#a5b4fc" opacity="0.4"/>
  <circle cx="256" cy="412" r="3" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="110" cy="256" r="4" fill="#a5b4fc" opacity="0.4"/>
</svg>
