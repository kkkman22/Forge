name: secret-scan

# Audit P3: no pre-commit/PR secret scanner existed. secret-redactor.ts handles
# runtime redaction, but a committed secret in source/docs/config would still
# land in the repo. This gitleaks scan is defense-in-depth alongside redaction.

on:
  pull_request:
    paths:
      - "**"
      - "!*.lock"
      - "!dist/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for scan accuracy
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
