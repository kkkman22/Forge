name: CI UltraReview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ultrareview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check ANTHROPIC_API_KEY
        id: check_key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not configured. Skipping ultra-review."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.check_key.outputs.has_key == 'true'
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Run UltraReview
        if: steps.check_key.outputs.has_key == 'true'
        id: ultrareview
        run: bash scripts/run-ci-ultrareview.sh "${{ github.event.pull_request.number }}"
        continue-on-error: true

      - name: Upload review artifact
        if: always() && steps.check_key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ultrareview-pr-${{ github.event.pull_request.number }}
          path: .tinkerman/reviews/${{ github.event.pull_request.number }}-ci.md
          retention-days: 30

      - name: Read review results
        if: always() && steps.check_key.outputs.has_key == 'true'
        id: read_results
        run: |
          REVIEW_FILE=".tinkerman/reviews/${{ github.event.pull_request.number }}-ci.md"
          if [ -f "$REVIEW_FILE" ]; then
            # Extract severity counts from frontmatter
            P0=$(sed -n '/^severity_counts:/,/^[^ ]/p' "$REVIEW_FILE" | grep 'P0:' | awk '{print $2}' || echo "0")
            P1=$(sed -n '/^severity_counts:/,/^[^ ]/p' "$REVIEW_FILE" | grep 'P1:' | awk '{print $2}' || echo "0")
            P2=$(sed -n '/^severity_counts:/,/^[^ ]/p' "$REVIEW_FILE" | grep 'P2:' | awk '{print $2}' || echo "0")
            P3=$(sed -n '/^severity_counts:/,/^[^ ]/p' "$REVIEW_FILE" | grep 'P3:' | awk '{print $2}' || echo "0")
            echo "p0=$P0" >> "$GITHUB_OUTPUT"
            echo "p1=$P1" >> "$GITHUB_OUTPUT"
            echo "p2=$P2" >> "$GITHUB_OUTPUT"
            echo "p3=$P3" >> "$GITHUB_OUTPUT"
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        if: always() && steps.check_key.outputs.has_key == 'true' && steps.read_results.outputs.has_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const p0 = '${{ steps.read_results.outputs.p0 }}' || '0';
            const p1 = '${{ steps.read_results.outputs.p1 }}' || '0';
            const p2 = '${{ steps.read_results.outputs.p2 }}' || '0';
            const p3 = '${{ steps.read_results.outputs.p3 }}' || '0';
            const prNumber = ${{ github.event.pull_request.number }};
            const runId = '${{ github.run_id }}';
            const success = ${{ steps.ultrareview.outcome }} === 'success';
            const total = Number(p0) + Number(p1) + Number(p2) + Number(p3);

            let body;
            if (Number(p0) > 0) {
              body = `## 🔴 UltraReview — P0 Found\n\n` +
                `| Severity | Count |\n|----------|-------|\n` +
                `| P0 | **${p0}** |\n| P1 | ${p1} |\n| P2 | ${p2} |\n| P3 | ${p3} |\n\n` +
                `**This PR is blocked by P0 findings.**\n\n` +
                `[Download full report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})`;
            } else if (total === 0) {
              body = `## ✅ UltraReview — Passed\n\nNo findings detected.\n\n` +
                `[View run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})`;
            } else {
              body = `## ✅ UltraReview — Passed (with findings)\n\n` +
                `| Severity | Count |\n|----------|-------|\n` +
                `| P0 | ${p0} |\n| P1 | ${p1} |\n| P2 | ${p2} |\n| P3 | ${p3} |\n\n` +
                `[Download full report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})`;
            }

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## ') &&
              c.body.includes('UltraReview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

      - name: Fail on P0
        if: steps.check_key.outputs.has_key == 'true' && steps.read_results.outputs.p0 != '0' && steps.read_results.outputs.p0 != ''
        run: |
          echo "::error::P0 findings detected (${{ steps.read_results.outputs.p0 }}). UltraReview failed."
          exit 1
