name: Docs Governance

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".forge/config.md"
      - "docs/_ssot/**"
      - "*.md"
      - "skills/forge/lib/**"
      - "src/docs-governance/**"
      - "scripts/check-docs-*"
      - "scripts/build-docs-*"
  pull_request:
    paths:
      - "docs/**"
      - ".forge/config.md"
      - "docs/_ssot/**"
      - "*.md"
      - "skills/forge/lib/**"
      - "src/docs-governance/**"
      - "scripts/check-docs-*"
      - "scripts/build-docs-*"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Run docs governance checks
        run: npm run docs:check -- --ci
        timeout-minutes: 10
        env:
          CI: "true"
          FORGE_HOOK: "1"

      - name: Check grace period expiry
        run: |
          CONFIG=".forge/config.md"
          if [ -f "$CONFIG" ]; then
            GRACE_UNTIL=$(grep -A1 'grace_period_until' "$CONFIG" 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            if [ -n "$GRACE_UNTIL" ]; then
              TODAY=$(date -u +%Y-%m-%d)
              if [ "$TODAY" \> "$GRACE_UNTIL" ]; then
                echo "::warning::Grace period expired on $GRACE_UNTIL. All docs governance checks are now enforced."
              else
                echo "::notice::Grace period active until $GRACE_UNTIL. Checks run but do not block."
              fi
            fi
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-governance-diagnostics
          path: docs-governance-diagnostics.ndjson
          retention-days: 7

  docs-bypass-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect --no-verify bypass
        run: |
          # Check recent commits for --no-verify trailer or missing hook traces
          RANGE="HEAD~5..HEAD"
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            RANGE="origin/main..HEAD"
          fi
          COMMITS=$(git log --format='%H %s' "$RANGE" 2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            echo "No commits to inspect."
            exit 0
          fi

          while IFS=' ' read -r hash msg; do
            [ -z "$hash" ] && continue
            TRAILERS=$(git log -1 --format='%(trailers)' "$hash" 2>/dev/null || true)
            if echo "$TRAILERS" | grep -qi "no-verify"; then
              echo "::error::Commit $hash ($msg) has --no-verify trailer. Docs governance checks were bypassed."
              exit 1
            fi
          done <<< "$COMMITS"

          echo "No --no-verify bypass detected."
