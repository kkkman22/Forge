name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify docs generation
        run: npm run docs
      - run: npm run test:coverage
      - name: Check README metrics
        run: bash scripts/check-readme-metrics.sh
      - name: Build dist bundle
        run: bash scripts/build-dist.sh
      - name: Verify dist bundle
        run: |
          test -f dist/claude-code/bundles/forge/INSTALL.md
          test -f dist/claude-code/bundles/forge/VERSION
          test -d dist/claude-code/bundles/forge/skills
          test -d dist/claude-code/bundles/forge/commands
      - name: Shellcheck scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck scripts/*.sh
          else
            echo "::warning::shellcheck not installed, skipping"
          fi
      - name: Validate hooks.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf-8'))"
      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::$f missing YAML frontmatter"
              exit 1
            fi
            if ! sed -n '/^---$/,/^---$/p' "$f" | grep -q '^name:'; then
              echo "::error::$f missing 'name' in frontmatter"
              exit 1
            fi
          done

  verify-dist:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dist bundle
        run: bash scripts/build-dist.sh
      - name: Check for dist changes
        run: |
          if [ ! -f dist/claude-code/bundles/.manifest.sha256 ]; then
            echo "::error::dist manifest not found. Run 'bash scripts/build-dist.sh' locally and commit dist/claude-code/bundles/.manifest.sha256."
            exit 1
          fi
          cp dist/claude-code/bundles/.manifest.sha256 /tmp/old-manifest.sha256
          bash scripts/build-dist.sh
          if ! diff -q /tmp/old-manifest.sha256 dist/claude-code/bundles/.manifest.sha256 >/dev/null 2>&1; then
            echo "::error::dist is out of sync with source. Run 'bash scripts/build-dist.sh' locally and commit the updated .manifest.sha256."
            diff /tmp/old-manifest.sha256 dist/claude-code/bundles/.manifest.sha256 || true
            exit 1
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Compile TypeScript
        run: npx tsc
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
