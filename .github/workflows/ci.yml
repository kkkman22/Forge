name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Daily at 04:00 UTC — re-scan main for new npm audit advisories
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify command registry generation chain
        run: node scripts/sync-command-registry.mjs --check
      - name: Verify docs generation
        run: npm run docs
      - name: Compile TypeScript
        run: npx tsc
      - name: Build dist bundle
        run: bash scripts/build-dist.sh
      - run: npm run test:coverage
      - name: Check README metrics
        if: github.event_name == 'pull_request'
        run: bash scripts/check-readme-metrics.sh
      - name: Verify dist bundle
        run: |
          test -f dist/claude-code/bundles/forge/INSTALL.md
          test -f dist/claude-code/bundles/forge/VERSION
          test -d dist/claude-code/bundles/forge/skills
          test -d dist/claude-code/bundles/forge/commands
      - name: Verify dist sync
        run: node scripts/check-dist-sync.mjs
      - name: Verify bundle sync
        run: node scripts/check-bundle-sync.mjs
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Shellcheck scripts
        run: shellcheck -x -S warning scripts/*.sh
      - name: Validate hooks.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf-8'))"
      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::$f missing YAML frontmatter"
              exit 1
            fi
            if ! sed -n '/^---$/,/^---$/p' "$f" | grep -q '^name:'; then
              echo "::error::$f missing 'name' in frontmatter"
              exit 1
            fi
          done
      - name: Validate spec index script
        run: node --check scripts/rebuild-spec-index.mjs
      - name: Check spec index consistency
        run: |
          if [ -d .forge/specs ]; then
            node scripts/rebuild-spec-index.mjs --check
          else
            echo "No .forge/specs/ directory — skipping spec index check"
          fi

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high / critical)
        run: npm audit --audit-level=high
      - name: Check dependency hygiene
        run: node scripts/check-deps.mjs

  security-audit-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (nightly scan of main)
        run: npm audit --audit-level=high
      - name: Check dependency hygiene
        run: node scripts/check-deps.mjs

  type-strict:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck with skipLibCheck=false
        run: npx tsc --noEmit --skipLibCheck false

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run PR benchmarks
        run: npx vitest bench --run --outputJson=/tmp/pr-bench.json
      - name: Checkout main for baseline
        run: |
          git stash --include-untracked || true
          git checkout origin/main -- .
      - name: Run main baseline benchmarks
        run: npx vitest bench --run --outputJson=/tmp/main-bench.json
      - name: Restore PR branch
        run: |
          git reset --hard
          git stash pop || true
      - name: Compare benchmarks
        id: compare
        run: |
          node scripts/extract-bench-json.mjs /tmp/main-bench.json /tmp/pr-bench.json \
            --threshold=1.20 > /tmp/bench-comparison.json
      - name: Post bench comparison as PR comment
        if: always()
        run: |
          if [[ -f /tmp/bench-comparison.json ]]; then
            node scripts/render-bench-markdown.mjs /tmp/bench-comparison.json \
              > /tmp/bench-comment.md || true
            cat /tmp/bench-comment.md || true
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Upload temp dirs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-temp-dirs
          path: /tmp/forge-e2e-*
          retention-days: 3

  # Forge is distributed via Claude plugin marketplace (`claude plugin install
  # forge`), not the npm registry — `npm view forge-loop` → 404 and the package
  # was never published. The former `publish` job ran `npm publish` on every
  # release tag and always failed (NPM_TOKEN intentionally unset). It is
  # replaced by `release-evidence`, which keeps the release-tag verification
  # and the machine-readable release-checklist artifact, but drops npm publish.
  release-evidence:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, security-audit, e2e, plugin-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compile + build MUST precede the full check suite because
      # npm run check includes compiled-runtime smoke tests that import
      # from dist/src/ — which is gitignored and only exists after tsc.
      - name: Compile TypeScript
        run: npx tsc
      - name: Build and verify bundles
        run: |
          bash scripts/build-dist.sh
          node scripts/check-dist-sync.mjs
          node scripts/check-bundle-sync.mjs
      - name: Full check suite
        run: npm run check
      - name: Coverage gate
        run: npm run test:coverage
      - name: Security audit
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: Generate release checklist
        run: node scripts/generate-release-checklist.mjs --output release-checklist.json
      - name: Upload release checklist
        uses: actions/upload-artifact@v4
        with:
          name: release-checklist
          path: release-checklist.json
          retention-days: 90

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Validate plugin manifest
        # Security: fail if sandbox is unavailable to prevent bypassing security boundaries
        env:
          SANDBOX_FAIL_IF_UNAVAILABLE: "1"
        run: claude plugin validate .
      - name: Validate plugin manifest schema
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8'))"
      - name: Validate marketplace manifest schema
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf-8'))"
      - name: Run plugin manifest contract tests (AC 13.1, 13.2)
        run: npx vitest run test/plugin-manifest.test.ts
      - name: Run marketplace install simulation (AC 13.3)
        run: npx vitest run test/plugin-marketplace-install/
      - name: Verify --help baseline has not drifted (AC 7.5)
        run: node scripts/record-help-baseline.mjs --check
      - name: Verify plugin.json version matches package.json
        run: |
          plugin_ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8')).version)")
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          if [ "$plugin_ver" != "$pkg_ver" ]; then
            echo "::error::plugin.json version ($plugin_ver) != package.json version ($pkg_ver)"
            exit 1
          fi
          echo "Version check passed: $plugin_ver"
      - name: Verify commands directory
        run: |
          count=$(ls commands/*.md 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "::error::Expected >= 1 commands, found $count"
            exit 1
          fi
          echo "Commands check passed: $count commands"
      - name: Compile TypeScript
        run: npx tsc
      - name: Build plugin dist package
        run: bash scripts/build-dist.sh
      - name: Verify command count in docs
        run: node scripts/gen-plugin-commands.mjs --verify-count
      - name: Verify plugin dist
        run: |
          test -d dist-plugin/.claude-plugin
          test -d dist-plugin/skills
          test -d dist-plugin/agents
          test -d dist-plugin/commands
      - name: Upload plugin artifact on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: forge-plugin
          path: dist-plugin/
          retention-days: 30
