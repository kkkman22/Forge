name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build dist bundle
        run: bash scripts/build-dist.sh
      - name: Verify dist bundle
        run: |
          test -f dist/claude-code/bundles/forge/INSTALL.md
          test -f dist/claude-code/bundles/forge/VERSION
          test -d dist/claude-code/bundles/forge/skills
          test -d dist/claude-code/bundles/forge/commands
      - name: Shellcheck scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck scripts/*.sh
          else
            echo "::warning::shellcheck not installed, skipping"
          fi
      - name: Validate hooks.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf-8'))"
      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "::error::$f missing YAML frontmatter"
              exit 1
            fi
            if ! sed -n '/^---$/,/^---$/p' "$f" | grep -q '^name:'; then
              echo "::error::$f missing 'name' in frontmatter"
              exit 1
            fi
          done

  verify-dist:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dist bundle
        run: bash scripts/build-dist.sh
      - name: Check for dist changes
        run: |
          git add dist/
          if ! git diff --cached --quiet; then
            echo "::error::dist is out of sync with source. Run 'bash scripts/build-dist.sh' locally and commit the changes."
            exit 1
          fi
