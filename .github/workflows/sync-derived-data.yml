name: Sync derived data

concurrency:
  group: sync-derived-${{ github.sha }}
  cancel-in-progress: false

# Runs on push to main after a merge. Auto-updates all derived / reference data
# that can drift when source code changes:
#   - README test metrics
#   - lib manifest sha256
#   - CLI help baseline
#   - dist bundle manifest
#   - performance benchmark baseline
#
# Uses [skip ci] in the auto-commit message to prevent infinite trigger loops.
# Replaces the former update-baseline.yml (benchmark baseline now lives here).

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1. Sync README test metrics
      - name: Sync README metrics
        run: bash scripts/sync-readme-metrics.sh

      # 2. Sync lib manifest sha256
      - name: Sync lib manifest
        run: node scripts/build-lib-manifest.mjs

      # 3. Sync CLI help baseline
      - name: Sync help baseline
        run: node scripts/record-help-baseline.mjs

      # 4. Sync dist: tsc compilation
      - name: Sync tsc output
        run: rm -rf dist/src dist/test dist/scripts && rm -f tsconfig.tsbuildinfo && npx tsc

      - name: Sync command count declarations
        run: node scripts/gen-plugin-commands.mjs --stamp-count --allow-stamp

      # 5. Run benchmarks and append to metrics.md
      - name: Run benchmarks
        run: npx vitest bench --run --outputJson=bench-result.json

      - name: Append baseline to metrics.md
        run: node scripts/append-baseline.mjs bench-result.json --keep=30

      # 6. Rebuild dist bundle LAST (after all other syncs, so zip includes final state)
      - name: Sync dist bundle
        run: bash scripts/build-dist.sh

      # 7. Mark merged specs as completed
      - name: Mark completed specs
        run: node scripts/mark-specs-completed.mjs

      # 8. Commit all changes (if any)
      - name: Commit derived data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            # Remove compiled TypeScript output before staging
            # These are regenerated on-demand by CI and should not be tracked in git.
            # dist-plugin/ is also gitignored now (rebuilt by build-dist.sh);
            # removing it keeps the on-disk state clean post-commit.
            rm -rf dist/src dist/scripts dist/locales dist/test dist/workflows dist-plugin
            git add -A
            git commit -m "ci: sync derived data [skip ci]"
            git push
          else
            echo "No derived data changes to commit."
          fi

      # 9. Verify non-volatile sync results
      - name: Verify help baseline after sync
        run: node scripts/record-help-baseline.mjs --check
