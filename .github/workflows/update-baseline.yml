name: Update performance baseline

# Runs only on push to main after a merge. Produces a fresh benchmark run
# and appends the results to .forge/knowledge/metrics.md. Uses `[skip ci]`
# in the auto-commit message to prevent an infinite trigger loop.
on:
  push:
    branches: [main]

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run benchmarks
        run: npx vitest bench --run --outputJson=bench-result.json

      - name: Append baseline to metrics.md
        run: node scripts/append-baseline.mjs bench-result.json --keep=30

      - name: Commit baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- .forge/knowledge/metrics.md; then
            git add .forge/knowledge/metrics.md
            git commit -m "ci: update performance baseline [skip ci]"
            git push
          else
            echo "No baseline change to commit."
          fi
