name: Deploy API docs

# Publishes the typedoc-generated API reference to GitHub Pages instead of
# committing the 25MB of HTML into the repo (audit §3.5 P2 #6). The typedoc
# output (`docs/api`) is gitignored on main; this workflow regenerates it on
# every main push and deploys it as a Pages artifact, so the reference stays
# public without bloating .git history.

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels the in-flight run.
concurrency:
  group: deploy-api-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Configure GitHub Pages
        id: pages
        # enablement: true auto-creates the Pages site if it does not exist yet,
        # so the workflow does not require a manual Settings → Pages step.
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Generate typedoc API reference
        run: npm run docs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/api

  # Deploy only on main: the github-pages environment has branch-protection
  # rules that reject deploys from feature branches, so on PR/feature branches
  # we only validate the build (above) and skip the deploy step.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
